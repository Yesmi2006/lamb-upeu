server:
  port: 18080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pagatu-catalogo-categorias
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/categorias/**
            - id: pagatu-catalogo-productos
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/productos/**
            - id: lamb-planificacion-cursos
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/cursos/**
            - id: lamb-planificacion-secciones
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/secciones/**
            - id: lamb-matricula
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/matriculas/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always