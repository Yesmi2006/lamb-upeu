global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "lamb-microservicios"
    eureka_sd_configs:
      - server: "http://lamb-eureka:8761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
