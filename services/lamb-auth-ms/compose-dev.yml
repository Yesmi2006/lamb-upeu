name: lamb-auth-dev

services:
  postgres-auth-dev:
    image: postgres:16-alpine
    container_name: lamb-postgres-auth-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: lamb_auth_db
      POSTGRES_USER: lamb
      POSTGRES_PASSWORD: lamb
    ports:
      - "15451:5432"
    volumes:
      - lamb_auth_dev_data:/var/lib/postgresql/data

volumes:
  lamb_auth_dev_data: