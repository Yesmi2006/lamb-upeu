name: lamb-finanzas-dev

services:
  postgres-finanzas-dev:
    image: postgres:16-alpine
    container_name: lamb-postgres-finanzas-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: lamb_finanzas_db
      POSTGRES_USER: lamb
      POSTGRES_PASSWORD: lamb
    ports:
      - "15457:5432"
    volumes:
      - lamb_finanzas_dev_data:/var/lib/postgresql/data

volumes:
  lamb_finanzas_dev_data: